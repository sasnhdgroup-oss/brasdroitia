# Déploiement automatique de brasdroitia.com depuis ce dépôt (branche main).

[build]
  publish = "."
  # Retire du site public les notes internes, le plan SEO, le gabarit et les outils.
  command = "rm -rf *.md *.zip guides/_* astuces/_* _outils && echo site-pret"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Offre réservée aux professionnels (CGV v2.0 du 02/11/2026) : l'ancienne page de rétractation renvoie vers la garantie commerciale.
[[redirects]]
  from = "/renoncer/*"
  to = "/cgv.html#garantie"
  status = 301
  force = true

[[redirects]]
  from = "/renoncer"
  to = "/cgv.html#garantie"
  status = 301
  force = true

# Fin de « Contenus du mois » et de la Fiche Google à 39 € (décision d'Abdellah du 25/11/2026) : un seul produit, le service artisans.
[[redirects]]
  from = "/plan/*"
  to = "/relance-devis/"
  status = 301
  force = true

[[redirects]]
  from = "/plan"
  to = "/relance-devis/"
  status = 301
  force = true

[[redirects]]
  from = "/echantillon/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/echantillon"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/demarrage/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/demarrage"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fiche-google/*"
  to = "/guides/fiche-google-business-profile/"
  status = 301
  force = true

[[redirects]]
  from = "/fiche-google"
  to = "/guides/fiche-google-business-profile/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
