# Déploiement automatique de brasdroitia.com depuis ce dépôt (branche main).

[build]
  publish = "."
  # Retire du site public les notes internes, le plan SEO, le gabarit et les outils.
  command = "rm -rf *.md *.zip guides/_* astuces/_* _outils && echo site-pret"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Offre réservée aux professionnels (CGV v2.0 du 02/11/2026) : l'ancienne page de rétractation renvoie vers la garantie commerciale.
[[redirects]]
  from = "/renoncer/*"
  to = "/cgv.html#garantie"
  status = 301
  force = true

[[redirects]]
  from = "/renoncer"
  to = "/cgv.html#garantie"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
